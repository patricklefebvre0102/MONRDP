name: RDP Tailscale (stable)

on:
  workflow_dispatch:
    inputs:
      nom_machine:
        description: "Nom Tailscale de la machine (lettres minuscules, chiffres, tirets)"
        required: false
        default: "gh-runner"
      duree_minutes:
        description: "Duree de chaque session en minutes (max 340, limite GitHub = 6 h)"
        required: false
        default: "335"
      relais:
        description: "Relais automatique : relance une nouvelle session a la fin (true/false)"
        required: false
        default: "true"
      max_relais:
        description: "Nombre maximum de relais enchaines (securite pour ne pas vider le quota)"
        required: false
        default: "4"
      sessions_multiples:
        description: "Plusieurs appareils en meme temps : chaque appareil a sa propre session (true), ou un seul bureau repris par le dernier appareil connecte (false)"
        required: false
        default: "true"
      rang:
        description: "NE PAS TOUCHER : numero du relais (rempli automatiquement)"
        required: false
        default: "1"
      precedent:
        description: "NE PAS TOUCHER : id de la session precedente (rempli automatiquement)"
        required: false
        default: ""
      logiciels:
        description: "Logiciels a installer a chaque session (noms Chocolatey separes par des virgules, vide = aucun)"
        required: false
        default: "googlechrome,notepadplusplus,7zip,vlc"

permissions:
  contents: read
  actions: write   # necessaire pour que la session lance la suivante

concurrency:
  group: rdp-session
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-2025   # Windows Server 2025, version figee (pas de surprise avec windows-latest)
    # Les runners heberges par GitHub sont plafonnes a 360 min (6 h).
    timeout-minutes: 360

    env:
      RDP_USERNAME: ${{ secrets.RDP_USERNAME || 'kipre10' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      NOM_MACHINE: ${{ inputs.nom_machine || 'gh-runner' }}
      SESSION_MINUTES: ${{ inputs.duree_minutes || '335' }}
      RELAIS: ${{ inputs.relais || 'true' }}
      MAX_RELAIS: ${{ inputs.max_relais || '4' }}
      RANG: ${{ inputs.rang || '1' }}
      MULTI_SESSIONS: ${{ inputs.sessions_multiples || 'true' }}
      LOGICIELS: ${{ inputs.logiciels }}   # vide = aucun logiciel installe
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optionnel : alertes sur ton telephone (ntfy.sh)

    steps:
      # ------------------------------------------------------------------
      # 1. Configuration RDP : activation, securite, AUCUN timeout de session
      # ------------------------------------------------------------------
      - name: Configurer RDP (sans coupure de session)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Set-Dword($Path, $Name, $Value) {
            if (-not (Test-Path $Path)) { New-Item -Path $Path -Force | Out-Null }
            New-ItemProperty -Path $Path -Name $Name -Value $Value -PropertyType DWord -Force | Out-Null
          }

          $ts   = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $ws   = "$ts\WinStations\RDP-Tcp"
          $pol  = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'

          # Activer le Bureau a distance
          Set-Dword $ts 'fDenyTSConnections' 0

          # NLA + chiffrement TLS actifs (securite correcte, fonctionne avec un utilisateur local)
          Set-Dword $ws 'UserAuthentication' 1
          Set-Dword $ws 'SecurityLayer' 2

          # Plusieurs appareils : un meme utilisateur peut ouvrir plusieurs sessions en parallele
          # (0 = plusieurs sessions par utilisateur, 1 = une seule session reprise par le dernier appareil).
          # Windows Server sans licence RDS autorise 2 sessions simultanees au maximum.
          $multi = if ($env:MULTI_SESSIONS -eq 'true') { 0 } else { 1 }
          Set-Dword $ts  'fSingleSessionPerUser' $multi
          Set-Dword $pol 'fSingleSessionPerUser' $multi
          Set-Dword $pol 'MaxInstanceCount' 999999
          Write-Host "Sessions multiples : $($env:MULTI_SESSIONS)"

          # Aucune limite : inactivite, deconnexion, duree de connexion
          foreach ($n in 'MaxIdleTime','MaxDisconnectionTime','MaxConnectionTime') {
            Set-Dword $ws $n 0
            Set-Dword $pol $n 0
          }
          # Ne jamais fermer une session deconnectee, garder la session vivante (keep-alive)
          Set-Dword $pol 'fResetBroken' 0
          Set-Dword $pol 'KeepAliveEnable' 1
          Set-Dword $pol 'KeepAliveInterval' 1
          Set-Dword $pol 'fDisableAutoReconnect' 0
          Set-Dword $ts 'KeepAliveTimeout' 1

          # Pas de veille, pas d'hibernation, pas d'extinction d'ecran, pas de verrouillage
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /hibernate off
          Set-Dword 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization' 'NoLockScreen' 1
          Set-Dword 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' 'AllowDomainPINLogon' 0

          # Pare-feu : RDP uniquement depuis le reseau Tailscale (100.64.0.0/10), TCP + UDP
          # (le UDP rend la connexion plus fluide, surtout depuis un telephone ou une tablette)
          Disable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale*' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName 'RDP-Tailscale' -Direction Inbound -Protocol TCP `
            -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Action Allow | Out-Null
          New-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' -Direction Inbound -Protocol UDP `
            -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Action Allow | Out-Null

          # Le service RDP redemarre tout seul s'il plante
          Set-Service -Name TermService -StartupType Automatic
          sc.exe failure TermService reset= 86400 actions= restart/5000/restart/5000/restart/5000 | Out-Null
          Restart-Service -Name TermService -Force
          Write-Host "RDP configure."

      # ------------------------------------------------------------------
      # 2. Utilisateur RDP (le mot de passe n'est JAMAIS affiche ni exporte)
      # ------------------------------------------------------------------
      - name: Creer ou mettre a jour l'utilisateur RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($username)) { Write-Error "Secret RDP_USERNAME manquant."; exit 1 }
          if ([string]::IsNullOrWhiteSpace($password)) { Write-Error "Secret RDP_PASSWORD manquant."; exit 1 }
          if ($username.Length -gt 20)                 { Write-Error "RDP_USERNAME : 20 caracteres maximum."; exit 1 }
          if ($password.Length -lt 14)                 { Write-Error "RDP_PASSWORD : 14 caracteres minimum. Mets a jour le secret dans GitHub (Settings > Secrets and variables > Actions)."; exit 1 }
          $classes = 0
          if ($password -cmatch '[a-z]')        { $classes++ }
          if ($password -cmatch '[A-Z]')        { $classes++ }
          if ($password -match  '\d')           { $classes++ }
          if ($password -match  '[^a-zA-Z0-9]') { $classes++ }
          if ($classes -lt 3) { Write-Error "RDP_PASSWORD : melange au moins 3 types (minuscules, MAJUSCULES, chiffres, symboles)."; exit 1 }

          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-LocalUser -Name $username -Password $secure -AccountNeverExpires -PasswordNeverExpires | Out-Null
            Write-Host "Utilisateur cree : $username"
          } else {
            Set-LocalUser -Name $username -Password $secure -PasswordNeverExpires $true
            Enable-LocalUser -Name $username
            Write-Host "Utilisateur mis a jour : $username"
          }

          foreach ($group in 'Remote Desktop Users','Administrators') {
            if (-not (Get-LocalGroupMember -Group $group -Member $username -ErrorAction SilentlyContinue)) {
              Add-LocalGroupMember -Group $group -Member $username
            }
          }

      # ------------------------------------------------------------------
      # 2b. Dossier persistant C:\Persist : ce qu'on y met survit au relais
      # ------------------------------------------------------------------
      - name: Preparer le dossier persistant (C:\Persist)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRECEDENT: ${{ inputs.precedent }}
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\Persist' | Out-Null
          icacls 'C:\Persist' /grant 'Users:(OI)(CI)F' | Out-Null

          if (-not [string]::IsNullOrWhiteSpace($env:PRECEDENT)) {
            Write-Host "Restauration des fichiers de la session $($env:PRECEDENT)..."
            gh run download $env:PRECEDENT --repo $env:GITHUB_REPOSITORY -n "persist-$($env:PRECEDENT)" -D 'C:\Persist'
            if ($LASTEXITCODE -ne 0) { Write-Warning "Rien a restaurer (dossier vide ou sauvegarde absente)." }
          }

          # Raccourci sur le bureau de tous les utilisateurs
          $w = New-Object -ComObject WScript.Shell
          $s = $w.CreateShortcut('C:\Users\Public\Desktop\Persist.lnk')
          $s.TargetPath = 'C:\Persist'
          $s.Save()
          $global:LASTEXITCODE = 0
          exit 0

      # ------------------------------------------------------------------
      # 3. Tailscale (derniere version stable, mode unattended)
      # ------------------------------------------------------------------
      - name: Installer Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'tailscale.msi'
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi -UseBasicParsing
              break
            } catch {
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 5
            }
          }
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { Write-Error "Installation Tailscale echouee (code $($p.ExitCode))."; exit 1 }
          Remove-Item $msi -Force
          Set-Service -Name Tailscale -StartupType Automatic
          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

      - name: Connecter la machine au Tailnet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { Write-Error "Secret TAILSCALE_AUTH_KEY manquant."; exit 1 }
          if ($env:NOM_MACHINE -notmatch '^[a-z0-9-]{1,40}$') { Write-Error "nom_machine invalide (a-z, 0-9, tirets)."; exit 1 }

          $tsExe    = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $hostname = $env:NOM_MACHINE

          & $tsExe up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=$hostname --unattended --accept-dns=false --reset
          if ($LASTEXITCODE -ne 0) { Write-Error "tailscale up a echoue."; exit 1 }

          $ip = $null
          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            $ip = (& $tsExe ip -4 2>$null | Select-String -Pattern '\d+\.\d+\.\d+\.\d+').Matches.Value | Select-Object -First 1
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error "Aucune IP Tailscale attribuee."; exit 1 }

          "TAILSCALE_IP=$ip"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAILSCALE_HOST=$hostname" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "IP Tailscale : $ip  (nom : $hostname)"

      - name: Verifier que RDP repond
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 6 -and -not $ok; $i++) {
            $ok = (Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded
            if (-not $ok) { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) { Write-Error "Le port 3389 ne repond pas."; exit 1 }
          Write-Host "RDP repond sur $($env:TAILSCALE_IP):3389"

      # ------------------------------------------------------------------
      # 3b. Logiciels (Chocolatey, deja present sur le runner). Un echec ici
      #     ne coupe jamais la session : le RDP est deja pret.
      # ------------------------------------------------------------------
      - name: Installer les logiciels
        shell: pwsh
        continue-on-error: true
        run: |
          $liste = ($env:LOGICIELS -split ',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          if (-not $liste) { Write-Host "Aucun logiciel demande."; exit 0 }
          foreach ($p in $liste) {
            if ($p -notmatch '^[a-zA-Z0-9._-]{1,60}$') { Write-Warning "Nom ignore (invalide) : $p"; continue }
            Write-Host "Installation de $p..."
            choco install $p -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { Write-Warning "Echec pour $p (code $LASTEXITCODE), on continue." }
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ------------------------------------------------------------------
      # 3c. Alerte telephone : la session est prete (jamais bloquant)
      # ------------------------------------------------------------------
      - name: Alerte - session prete
        shell: pwsh
        continue-on-error: true
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NTFY_TOPIC)) { Write-Host "Alertes desactivees (pas de secret NTFY_TOPIC)."; exit 0 }
          $msg = "RDP pret. Adresse : $($env:TAILSCALE_IP) (nom : $($env:TAILSCALE_HOST)). Session $($env:RANG) sur $($env:MAX_RELAIS) max."
          try { Invoke-RestMethod -Uri "https://ntfy.sh/$($env:NTFY_TOPIC)" -Method Post -Body $msg -Headers @{ Title = 'RDP pret' } -TimeoutSec 15 | Out-Null }
          catch { Write-Warning "ntfy indisponible : alerte non envoyee." }
          exit 0

      # ------------------------------------------------------------------
      # 4. Maintien de la session avec auto-reparation
      # ------------------------------------------------------------------
      - name: Maintenir la session (auto-reparation)
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $minutes = [Math]::Min([int]$env:SESSION_MINUTES, 340)
          $deadline = (Get-Date).AddMinutes($minutes)
          $prevenu = $false

          $modeTxt = if ($env:MULTI_SESSIONS -eq 'true') { 'plusieurs appareils en parallele (2 sessions max, une par appareil)' } else { 'un seul bureau, repris par le dernier appareil connecte' }

          $summary = @"
          ## Connexion RDP
          - **Adresse** : ``$($env:TAILSCALE_IP)`` (ou ``$($env:TAILSCALE_HOST)``)
          - **Utilisateur** : ``$($env:RDP_USERNAME)``
          - **Mot de passe** : celui du secret ``RDP_PASSWORD``
          - **Appareils** : $modeTxt
          - **Fin prevue** : $($deadline.ToString('HH:mm')) (heure du runner, UTC)
          - **Relais** : $($env:RELAIS) (session $($env:RANG) sur $($env:MAX_RELAIS) max)
          - **Fichiers a garder** : mets-les dans ``C:\Persist`` (raccourci sur le bureau)
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "=== RDP ACTIF ==="
          Write-Host "Adresse     : $env:TAILSCALE_IP"
          Write-Host "Nom         : $env:TAILSCALE_HOST"
          Write-Host "Utilisateur : $env:RDP_USERNAME"
          Write-Host "Appareils   : $modeTxt"
          Write-Host "Fin prevue  : $deadline (UTC)"
          Write-Host "================="

          function Test-Tailscale {
            try {
              $j = & $tsExe status --json 2>$null | ConvertFrom-Json
              return ($j.BackendState -eq 'Running')
            } catch { return $false }
          }

          function Ensure-FirewallRule($name, $proto) {
            $rule = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
            if (-not $rule -or $rule.Enabled -ne 'True') {
              Write-Warning "[$(Get-Date -Format s)] Regle pare-feu $name absente : recreation."
              Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue | Remove-NetFirewallRule
              New-NetFirewallRule -DisplayName $name -Direction Inbound -Protocol $proto `
                -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Action Allow | Out-Null
            }
          }

          $tick = 0
          while ((Get-Date) -lt $deadline) {
            $tick++

            # Service RDP
            $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
            if (-not $svc -or $svc.Status -ne 'Running') {
              Write-Warning "[$(Get-Date -Format s)] TermService arrete : redemarrage."
              Start-Service -Name TermService -ErrorAction SilentlyContinue
            }

            # Service + tunnel Tailscale
            $tsSvc = Get-Service -Name Tailscale -ErrorAction SilentlyContinue
            if (-not $tsSvc -or $tsSvc.Status -ne 'Running') {
              Write-Warning "[$(Get-Date -Format s)] Service Tailscale arrete : redemarrage."
              Start-Service -Name Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
            }
            if (-not (Test-Tailscale)) {
              Write-Warning "[$(Get-Date -Format s)] Tunnel Tailscale hors ligne : reconnexion."
              & $tsExe up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=$env:TAILSCALE_HOST --unattended --accept-dns=false 2>&1 | Out-Null
            }

            # Pare-feu : les regles doivent rester actives
            Ensure-FirewallRule 'RDP-Tailscale' 'TCP'
            Ensure-FirewallRule 'RDP-Tailscale-UDP' 'UDP'

            # Avertissement a l'ecran 10 minutes avant la fin
            if (-not $prevenu -and ((Get-Date) -gt $deadline.AddMinutes(-10))) {
              $prevenu = $true
              $txt = "Fin de session dans 10 min. Enregistre tes fichiers dans C:\Persist. Une nouvelle session demarre toute seule : reconnecte-toi dans 3 a 6 minutes."
              msg * /TIME:600 $txt 2>$null
            }

            # Battement de coeur toutes les 5 minutes (liste aussi les appareils connectes)
            if ($tick % 10 -eq 0) {
              $left = [int]($deadline - (Get-Date)).TotalMinutes
              Write-Host "[$(Get-Date -Format s)] OK - RDP et Tailscale actifs - reste ~$left min"
              quser 2>$null
            }
            Start-Sleep -Seconds 30
          }
          Write-Host "Duree atteinte : arret propre de la session."

      # ------------------------------------------------------------------
      # 4b. Relais : sauvegarde de C:\Persist puis lancement de la session suivante
      #     (ne s'execute PAS si tu annules le workflow : "Cancel" arrete la chaine)
      # ------------------------------------------------------------------
      - name: Sauvegarder C:\Persist
        if: success() && env.RELAIS == 'true' && fromJSON(env.RANG) < fromJSON(env.MAX_RELAIS)
        uses: actions/upload-artifact@v4
        with:
          name: persist-${{ github.run_id }}
          path: C:\Persist
          retention-days: 1
          if-no-files-found: ignore

      - name: Lancer la session suivante (relais)
        if: success() && env.RELAIS == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rang = [int]$env:RANG
          $max  = [int]$env:MAX_RELAIS
          if ($rang -ge $max) {
            Write-Host "Nombre maximum de relais atteint ($max) : fin de la chaine."
            exit 0
          }
          $next = $rang + 1
          Write-Host "Lancement du relais $next sur $max..."
          gh workflow run rdp.yml --repo $env:GITHUB_REPOSITORY --ref $env:GITHUB_REF_NAME `
            -f "nom_machine=$($env:NOM_MACHINE)" `
            -f "duree_minutes=$($env:SESSION_MINUTES)" `
            -f "relais=true" `
            -f "max_relais=$max" `
            -f "sessions_multiples=$($env:MULTI_SESSIONS)" `
            -f "rang=$next" `
            -f "logiciels=$($env:LOGICIELS)" `
            -f "precedent=$($env:GITHUB_RUN_ID)"
          if ($LASTEXITCODE -ne 0) { Write-Error "Impossible de lancer la session suivante."; exit 1 }
          Write-Host "Session suivante demandee : elle demarre des que celle-ci est terminee."

      # ------------------------------------------------------------------
      # 4c. Alerte telephone : fin de session ou probleme (jamais bloquant)
      # ------------------------------------------------------------------
      - name: Alerte - fin de session
        if: always()
        shell: pwsh
        continue-on-error: true
        env:
          STATUT: ${{ job.status }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NTFY_TOPIC)) { exit 0 }
          switch ($env:STATUT) {
            'success'   { $titre = 'RDP termine';  $msg = "Session $($env:RANG) terminee normalement. Si le relais est actif, la suivante demarre toute seule (3 a 6 min)." }
            'cancelled' { $titre = 'RDP annule';   $msg = "Session $($env:RANG) annulee ou interrompue. Aucun relais lance. Si le gardien est actif, il relancera." }
            default     { $titre = 'RDP PROBLEME'; $msg = "Session $($env:RANG) en echec. Regarde le journal dans l'onglet Actions. Si le gardien est actif, il relancera." }
          }
          try { Invoke-RestMethod -Uri "https://ntfy.sh/$($env:NTFY_TOPIC)" -Method Post -Body $msg -Headers @{ Title = $titre } -TimeoutSec 15 | Out-Null }
          catch { Write-Warning "ntfy indisponible : alerte non envoyee." }
          exit 0

      # ------------------------------------------------------------------
      # 5. Nettoyage : retirer la machine du Tailnet
      # ------------------------------------------------------------------
      - name: Retirer la machine du Tailnet
        if: always()
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $tsExe) { & $tsExe logout 2>&1 | Out-Null }
